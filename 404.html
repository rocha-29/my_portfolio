<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Page not found | Daniel Rocha</title>
  <meta name="color-scheme" content="dark light">
  <!-- GitHub Pages serves this file for any missing path, at any depth, so these paths are absolute to the project site. -->
  <link rel="icon" href="/my_portfolio/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/my_portfolio/css/styles.css">
  <script src="/my_portfolio/js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="/my_portfolio/" aria-label="D_R0x, Daniel Rocha: home">
        <img src="/my_portfolio/assets/favicon.svg" alt="" width="28" height="28">
        <span>D_R0x</span>
      </a>
    </div>
  </header>
  <main id="main" class="wrap notfound">
    <h1>This page does not exist</h1>
    <p class="lead">The address may be mistyped, or the page may have moved. Everything on this site lives on the home page.</p>
    <div class="certificate">
      <p class="certificate-command" aria-hidden="true">$ openssl verify requested-page.pem</p>
      <dl class="certificate-fields">
        <div class="field">
          <dt>Status</dt>
          <dd>404, not found</dd>
        </div>
        <div class="field">
          <dt>Next step</dt>
          <dd><a href="/my_portfolio/">Go to the home page</a></dd>
        </div>
      </dl>
    </div>
  </main>
</body>
</html>
